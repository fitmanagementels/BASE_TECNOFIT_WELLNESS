<script>
  const state = {
    page: 'vencimentos',
    filters: {},
    filtersByPage: {},
    charts: [],
    requestId: 0,
    currentData: null
  };

  const pageLabels = {
    vencimentos: 'Vencimentos dos alunos',
    fichas: 'Fichas prescritas',
    avaliacoes: 'Avaliações físicas',
    planos: 'Planos dos alunos'
  };

  const kpiMaps = {
    vencimentos: [['vencidos', 'Vencidos', 'number'], ['ate7', 'Vencem em 7 dias', 'number'], ['ate30', 'Vencem em 30 dias', 'number'], ['valorAte30', 'Valor a renovar', 'money']],
    fichas: [['atualizadas', 'Com ficha atualizada', 'number'], ['ausentes', 'Sem ficha', 'number'], ['desatualizadas', 'Ficha desatualizada', 'number'], ['cobertura', 'Cobertura', 'percent']],
    avaliacoes: [['atualizadas', 'Com avaliação atualizada', 'number'], ['ausentes', 'Sem avaliação', 'number'], ['desatualizadas', 'Avaliação desatualizada', 'number'], ['cobertura', 'Cobertura', 'percent']],
    planos: [['alunos', 'Alunos distintos', 'number'], ['contratos', 'Contratos', 'number'], ['valor', 'Valor contratado', 'money'], ['ticketMedio', 'Ticket médio', 'money']]
  };

  const listColumns = {
    vencimentos: [['aluno', 'Aluno'], ['contato', 'Contato'], ['frequencia', 'Frequência'], ['polo', 'Polo'], ['vencimento', 'Vencimento'], ['situacao', 'Situação', 'status'], ['valor', 'Valor', 'money']],
    fichas: [['aluno', 'Aluno'], ['contato', 'Contato'], ['polos', 'Polos', 'list'], ['data', 'Última ficha'], ['diasSemAtualizacao', 'Dias sem atualização', 'number'], ['situacao', 'Situação', 'status']],
    avaliacoes: [['aluno', 'Aluno'], ['contato', 'Contato'], ['polos', 'Polos', 'list'], ['data', 'Última avaliação'], ['diasSemAtualizacao', 'Dias sem atualização', 'number'], ['situacao', 'Situação', 'status']],
    planos: [['aluno', 'Aluno'], ['statusAluno', 'Status do aluno', 'status'], ['frequencia', 'Frequência'], ['modalidade', 'Modalidade'], ['polo', 'Polo'], ['inicioCorrente', 'Início corrente'], ['vencimento', 'Vencimento'], ['statusContrato', 'Status do contrato', 'status'], ['valor', 'Valor', 'money']]
  };

  const chartMaps = {
    vencimentos: [['situacao', 'Situação dos vencimentos', 'doughnut'], ['semanas', 'Vencimentos nas próximas semanas', 'bar'], ['porPolo', 'Vencimentos por polo', 'bar']],
    fichas: [['situacao', 'Situação das fichas', 'doughnut'], ['faixas', 'Faixas de idade das fichas', 'bar'], ['coberturaPorPolo', 'Cobertura de fichas por polo', 'bar', 'percent']],
    avaliacoes: [['situacao', 'Situação das avaliações', 'doughnut'], ['faixas', 'Faixas de idade das avaliações', 'bar'], ['coberturaPorPolo', 'Cobertura de avaliações por polo', 'bar', 'percent']],
    planos: [['polos', 'Contratos por polo', 'doughnut'], ['frequencias', 'Contratos por frequência', 'bar'], ['modalidades', 'Contratos por modalidade', 'bar'], ['status', 'Contratos por status', 'bar'], ['valorPorPolo', 'Valor contratado por polo', 'bar', 'money']]
  };

  const chartColors = ['#dfff22', '#9daa29', '#505a25', '#ffb84d', '#ff6b5f'];

  const situationLabels = {
    vencido: 'Vencido',
    ate7: 'Até 7 dias',
    ate30: 'De 8 a 30 dias',
    futuro: 'Após 30 dias',
    semData: 'Sem data',
    ausente: 'Ausente',
    desatualizada: 'Desatualizada',
    atualizada: 'Atualizada'
  };

  function situationLabel(value) {
    const technical = String(value == null ? '' : value);
    return situationLabels[technical] || technical;
  }

  function el(tag, className, text) {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (text != null) node.textContent = String(text);
    return node;
  }

  function clearNode(node) {
    node.replaceChildren();
  }

  function destroyCharts() {
    state.charts.forEach(function (chart) {
      chart.destroy();
    });
    state.charts = [];
  }

  function money(value) {
    return new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(Number(value) || 0);
  }

  function number(value) {
    return new Intl.NumberFormat('pt-BR').format(Number(value) || 0);
  }

  function percent(value) {
    return new Intl.NumberFormat('pt-BR', { maximumFractionDigits: 1 }).format(Number(value) || 0) + '%';
  }

  function maskContact(contact) {
    return String(contact || '').replace(/\d(?=\d{2})/g, '•');
  }

  function responseData(response) {
    if (!response || response.ok !== true || response.pagina !== state.page) return null;
    const data = response.dados;
    const isObject = function (value) {
      return value !== null && typeof value === 'object' && !Array.isArray(value);
    };
    if (!isObject(data) || !isObject(data.kpis) || !isObject(data.graficos) ||
        !Array.isArray(data.lista) || !isObject(data.filtros) || !isObject(data.paginacao)) return null;
    return data;
  }

  function setHealth(kind, response) {
    const updated = document.getElementById('lastUpdate');
    const warning = document.getElementById('importWarning');
    warning.textContent = '';
    warning.setAttribute('role', 'alert');
    warning.hidden = true;
    if (kind === 'loading') updated.textContent = 'Atualização indisponível durante o carregamento';
    else if (!response || kind === 'error') updated.textContent = 'Atualização indisponível';
    else updated.textContent = response.atualizadoEm ? 'Última atualização: ' + response.atualizadoEm : 'Nenhuma atualização válida disponível';
    if (response && kind !== 'loading' && kind !== 'error' && response.avisoImportacao) {
      warning.textContent = String(response.avisoImportacao);
      warning.hidden = false;
    }
  }

  function valueText(value, type) {
    if (type === 'money') return money(value);
    if (type === 'number') return value == null || value === '' ? '—' : number(value);
    if (type === 'percent') return percent(value);
    if (type === 'list') return Array.isArray(value) ? value.join(', ') : String(value || '—');
    return value == null || value === '' ? '—' : String(value);
  }

  function setContentVisibility(showContent) {
    ['filters', 'kpiGrid', 'chartGrid', 'listPanel'].forEach(function (id) {
      document.getElementById(id).hidden = !showContent;
    });
    document.getElementById('appState').hidden = showContent;
  }

  function showState(kind, message, actionLabel, action) {
    destroyCharts();
    setContentVisibility(kind === 'loading');
    const appState = document.getElementById('appState');
    appState.hidden = false;
    clearNode(appState);
    appState.className = kind === 'error' ? 'app-state error' : 'app-state';
    appState.setAttribute('role', kind === 'error' ? 'alert' : 'status');
    if (kind === 'loading') appState.appendChild(el('div', 'spinner'));
    appState.appendChild(el('p', '', message));
    if (actionLabel) {
      const button = el('button', 'filter-control', actionLabel);
      button.type = 'button';
      button.addEventListener('click', action);
      appState.appendChild(button);
    }
    const main = document.getElementById('mainContent');
    main.setAttribute('aria-busy', kind === 'loading' ? 'true' : 'false');
    if (kind === 'loading') {
      state.currentData = null;
      renderSkeletons();
    }
    setHealth(kind);
  }

  function renderSkeletons() {
    const definitions = [['kpiGrid', 4, 'card kpi-card skeleton'], ['chartGrid', 2, 'card chart-card skeleton'], ['listPanel', 1, 'skeleton list-skeleton']];
    definitions.forEach(function (definition) {
      const container = document.getElementById(definition[0]);
      clearNode(container);
      for (let index = 0; index < definition[1]; index += 1) container.appendChild(el('div', definition[2]));
    });
  }

  function navigate(page) {
    if (!Object.prototype.hasOwnProperty.call(pageLabels, page)) return;
    state.page = page;
    state.filters = Object.assign({}, state.filtersByPage[page] || {});
    document.querySelectorAll('[data-page]').forEach(function (button) {
      const active = button.dataset.page === page;
      button.classList.toggle('active', active);
      if (active) button.setAttribute('aria-current', 'page');
      else button.removeAttribute('aria-current');
    });
    document.getElementById('pageTitle').textContent = pageLabels[page];
    loadPage();
  }

  function loadPage() {
    const requestId = ++state.requestId;
    const requestedPage = state.page;
    const requestedFilters = Object.assign({}, state.filters);
    showState('loading', 'Carregando dashboard…');
    google.script.run
      .withSuccessHandler(function (response) {
        if (requestId !== state.requestId || requestedPage !== state.page) return;
        renderDashboard(response);
      })
      .withFailureHandler(function (error) {
        if (requestId !== state.requestId || requestedPage !== state.page) return;
        renderError(error);
      })
      .obterDadosPaginaDashboard(requestedPage, requestedFilters);
  }

  function renderError() {
    showState('error', 'Não foi possível carregar esta página.', 'Tentar novamente', loadPage);
  }

  function clearFilters() {
    state.filtersByPage[state.page] = {};
    state.filters = {};
    loadPage();
  }

  function renderEmpty(response) {
    showState('empty', 'Nenhum resultado para os filtros selecionados.', 'Limpar filtros', clearFilters);
    setHealth('empty', response);
  }

  function renderFilters(options) {
    const container = document.getElementById('filters');
    clearNode(container);
    const situationValues = state.page === 'vencimentos'
      ? ['vencido', 'ate7', 'ate30', 'futuro', 'semData']
      : (state.page === 'fichas' || state.page === 'avaliacoes'
        ? ['ausente', 'desatualizada', 'atualizada'] : []);
    const situations = situationValues.map(function (value) {
      return { value: value, label: situationLabel(value) };
    });
    const definitions = [
      { key: 'polo', source: 'polos', label: 'Polo' },
      { key: 'statusAluno', source: 'statusAlunos', label: 'Status do aluno' },
      { key: 'busca', label: 'Buscar aluno ou ID', input: true },
      { key: 'periodoDias', label: 'Vencimento no período', values: ['30', '60', '90'] },
      { key: 'situacao', label: 'Situação', values: situations },
      { key: 'frequencia', source: 'frequencias', label: 'Frequência' },
      { key: 'modalidade', source: 'modalidades', label: 'Modalidade' },
      { key: 'statusContrato', source: 'statusContratos', label: 'Status do contrato' }
    ];
    definitions.forEach(function (definition) {
      const values = definition.values || (options && Array.isArray(options[definition.source]) ? options[definition.source] : []);
      if (!definition.input && !values.length) return;
      const field = el('div', 'filter-field');
      const id = 'filter-' + definition.key;
      const label = el('label', '', definition.label);
      label.htmlFor = id;
      const select = el(definition.input ? 'input' : 'select', 'filter-control');
      select.id = id;
      select.name = definition.key;
      select.setAttribute('name', definition.key);
      if (definition.input) {
        select.type = 'search';
        select.value = state.filters[definition.key] || '';
      }
      if (!definition.input) {
      const all = el('option', '', 'Todos');
      all.value = '';
      select.appendChild(all);
      values.forEach(function (value) {
        const optionValue = value && typeof value === 'object' ? value.value : value;
        const optionLabel = value && typeof value === 'object' ? value.label : value;
        const option = el('option', '', optionLabel);
        option.value = String(optionValue);
        select.appendChild(option);
      });
      select.value = state.filters[definition.key] || '';
      }
      select.addEventListener('change', function () {
        const next = Object.assign({}, state.filters);
        delete next.paginaLista;
        if (select.value) next[definition.key] = select.value;
        else delete next[definition.key];
        state.filters = next;
        state.filtersByPage[state.page] = Object.assign({}, next);
        loadPage();
      });
      field.appendChild(label);
      field.appendChild(select);
      container.appendChild(field);
    });
  }

  function renderKpis(kpis) {
    const grid = document.getElementById('kpiGrid');
    clearNode(grid);
    (kpiMaps[state.page] || []).forEach(function (definition) {
      const card = el('article', 'card kpi-card');
      card.appendChild(el('p', 'kpi-label', definition[1]));
      card.appendChild(el('p', 'kpi-value', valueText(kpis && kpis[definition[0]], definition[2])));
      grid.appendChild(card);
    });
  }

  function chartValues(source) {
    if (Array.isArray(source)) {
      return {
        labels: source.map(function (item) { return String(item.label || item.polo || 'Não informado'); }),
        values: source.map(function (item) { return Number(item.valor != null ? item.valor : item.cobertura) || 0; })
      };
    }
    const keys = source && typeof source === 'object' ? Object.keys(source) : [];
    return {
      labels: keys.map(situationLabel),
      values: keys.map(function (key) { return Number(source[key]) || 0; })
    };
  }

  function renderCharts(graphs) {
    const grid = document.getElementById('chartGrid');
    clearNode(grid);
    destroyCharts();
    (chartMaps[state.page] || []).forEach(function (definition) {
      const card = el('article', 'card chart-card');
      const header = el('div', 'card-header');
      header.appendChild(el('h2', 'card-title', definition[1]));
      card.appendChild(header);
      const frame = el('div', 'chart-frame');
      const canvas = el('canvas');
      canvas.setAttribute('role', 'img');
      canvas.setAttribute('aria-label', definition[1]);
      const data = chartValues(graphs && graphs[definition[0]]);
      const summary = el('ul', 'chart-summary');
      summary.id = 'chart-summary-' + state.page + '-' + definition[0];
      canvas.setAttribute('aria-describedby', summary.id);
      data.labels.forEach(function (label, index) {
        var formatted = definition[3] === 'percent' ? percent(data.values[index])
          : definition[3] === 'money' ? money(data.values[index]) : number(data.values[index]);
        summary.appendChild(el('li', '', label + ': ' + formatted));
      });
      frame.appendChild(canvas);
      card.appendChild(frame);
      card.appendChild(summary);
      grid.appendChild(card);

      if (typeof Chart === 'undefined') {
        frame.replaceChildren(el('p', 'card-subtitle', 'Gráfico indisponível. Consulte os indicadores e a lista abaixo.'));
        return;
      }
      const reducedMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      const isCircular = definition[2] === 'doughnut';
      try {
        const chart = new Chart(canvas, {
          type: definition[2],
          data: {
            labels: data.labels,
            datasets: [{
              data: data.values,
              backgroundColor: isCircular ? chartColors : '#dfff22',
              borderColor: isCircular ? '#111313' : '#dfff22',
              borderWidth: isCircular ? 2 : 1
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            animation: reducedMotion ? false : undefined,
            plugins: { legend: { labels: { color: '#f5f7f7' } } },
            scales: isCircular ? {} : {
              x: { ticks: { color: '#969d9d' }, grid: { color: '#292c2c' } },
              y: { beginAtZero: true, ticks: { color: '#969d9d' }, grid: { color: '#292c2c' } }
            }
          }
        });
        state.charts.push(chart);
      } catch (error) {
        frame.replaceChildren(el('p', 'card-subtitle', 'Gráfico indisponível. Consulte os indicadores e a lista abaixo.'));
      }
    });
  }

  function statusClass(value) {
    const normalized = String(value || '').toLowerCase();
    if (normalized === 'atualizada' || normalized === 'ativo') return 'status status-success';
    if (normalized === 'vencido' || normalized === 'ausente') return 'status status-danger';
    return 'status status-warning';
  }

  function cellText(row, definition, mobile) {
    if (mobile && definition[0] === 'contato') return maskContact(row[definition[0]]);
    if (definition[2] === 'status') return situationLabel(row[definition[0]]);
    return valueText(row[definition[0]], definition[2]);
  }

  let detailRestoreFocus = null;
  let detailFallbackFocus = null;

  function detailFields(row) {
    const fields = [['aluno', 'Aluno'], ['contato', 'Contato']];
    (listColumns[state.page] || []).forEach(function (definition) {
      if (definition[0] !== 'aluno' && definition[0] !== 'contato') fields.push([definition[0], definition[1], definition[2]]);
    });
    return fields;
  }

  function openDetails(row, trigger) {
    const dialog = document.getElementById('detailDialog');
    const content = document.getElementById('detailContent');
    clearNode(content);
    const list = el('dl', 'detail-list');
    detailFields(row).forEach(function (definition) {
      list.appendChild(el('dt', 'card-subtitle', definition[1]));
      list.appendChild(el('dd', '', definition[2] === 'status'
        ? situationLabel(row[definition[0]]) : valueText(row[definition[0]], definition[2])));
    });
    content.appendChild(list);
    detailRestoreFocus = trigger;
    detailFallbackFocus = null;
    dialog.showModal();
    document.getElementById('detailClose').focus();
  }

  function closeDetails() {
    const dialog = document.getElementById('detailDialog');
    if (dialog.open) dialog.close();
  }

  function detailButton(row) {
    const button = el('button', 'filter-control detail-button', 'Ver detalhes');
    button.type = 'button';
    button.addEventListener('click', function () { openDetails(row, button); });
    return button;
  }

  function renderList(rows, pagination) {
    const panel = document.getElementById('listPanel');
    clearNode(panel);
    const header = el('div', 'list-header');
    header.appendChild(el('h2', 'card-title', 'Detalhamento'));
    header.appendChild(el('span', 'card-subtitle', number(pagination.totalItens) + ' registros'));
    panel.appendChild(header);

    const columns = listColumns[state.page] || [];
    const mobile = window.matchMedia && window.matchMedia('(max-width: 720px)').matches;
    if (!mobile) {
    const scroll = el('div', 'table-scroll');
    scroll.setAttribute('tabindex', '0');
    scroll.setAttribute('aria-label', 'Detalhamento dos dados; role para ver todas as colunas');
    const table = el('table', 'data-table');
    const thead = el('thead');
    const headingRow = el('tr');
    columns.forEach(function (definition) {
      const th = el('th', definition[2] === 'money' || definition[2] === 'number' ? 'numeric' : '', definition[1]);
      th.scope = 'col';
      headingRow.appendChild(th);
    });
    const hasDetails = rows.some(function (row) { return Boolean(row.contato); });
    if (hasDetails) {
      const th = el('th', '', 'Detalhes');
      th.scope = 'col';
      headingRow.appendChild(th);
    }
    thead.appendChild(headingRow);
    table.appendChild(thead);
    const tbody = el('tbody');
    rows.forEach(function (row) {
      const tr = el('tr');
      columns.forEach(function (definition) {
        const numeric = definition[2] === 'money' || definition[2] === 'number';
        const td = el('td', numeric ? 'numeric' : '');
        const text = cellText(row, definition, false);
        if (definition[2] === 'status') td.appendChild(el('span', statusClass(text), text));
        else td.textContent = text;
        tr.appendChild(td);
      });
      if (hasDetails) {
        const detailsCell = el('td');
        if (row.contato) detailsCell.appendChild(detailButton(row));
        tr.appendChild(detailsCell);
      }
      tbody.appendChild(tr);
    });
    table.appendChild(tbody);
    scroll.appendChild(table);
    panel.appendChild(scroll);
    } else {
    const mobileCards = el('div', 'mobile-cards');
    rows.forEach(function (row) {
      const card = el('article', 'mobile-data-row');
      columns.forEach(function (definition) {
        card.appendChild(el('span', 'card-subtitle', definition[1]));
        const text = cellText(row, definition, true);
        if (definition[2] === 'status') card.appendChild(el('span', statusClass(text), text));
        else card.appendChild(el('strong', '', text));
      });
      if (row.contato) card.appendChild(detailButton(row));
      mobileCards.appendChild(card);
    });
    panel.appendChild(mobileCards);
    }
    const pager = el('nav', 'pagination');
    pager.setAttribute('aria-label', 'Paginação da lista');
    const previous = el('button', 'filter-control', 'Anterior');
    previous.type = 'button';
    previous.disabled = pagination.pagina <= 1;
    const current = el('span', 'pagination-current', 'Página ' + pagination.pagina + ' de ' + pagination.totalPaginas);
    current.setAttribute('aria-live', 'polite');
    const next = el('button', 'filter-control', 'Próxima');
    next.type = 'button';
    next.disabled = pagination.pagina >= pagination.totalPaginas;
    function go(page) {
      state.filters.paginaLista = page;
      state.filtersByPage[state.page] = Object.assign({}, state.filters);
      loadPage();
    }
    previous.addEventListener('click', function () { go(pagination.pagina - 1); });
    next.addEventListener('click', function () { go(pagination.pagina + 1); });
    pager.appendChild(previous);
    pager.appendChild(current);
    pager.appendChild(next);
    panel.appendChild(pager);
  }

  function renderDashboard(response) {
    const data = responseData(response);
    if (!data) {
      renderError();
      return;
    }
    state.currentData = { response: response, data: data };
    if (state.filters.paginaLista && state.filters.paginaLista !== data.paginacao.pagina) {
      state.filters.paginaLista = data.paginacao.pagina;
      state.filtersByPage[state.page] = Object.assign({}, state.filters);
    }
    setHealth('ready', response);
    const rows = Array.isArray(data.lista) ? data.lista : [];
    if (!rows.length) {
      renderEmpty(response);
      return;
    }
    setContentVisibility(true);
    document.getElementById('mainContent').setAttribute('aria-busy', 'false');
    renderFilters(data.filtros || {});
    renderKpis(data.kpis || {});
    renderCharts(data.graficos || {});
    renderList(rows, data.paginacao);
  }

  function rerenderCurrentList() {
    if (!state.currentData || state.currentData.response.pagina !== state.page) return;
    const dialog = document.getElementById('detailDialog');
    if (dialog.open) {
      detailRestoreFocus = null;
      detailFallbackFocus = document.getElementById('mainContent');
      closeDetails();
    }
    renderList(state.currentData.data.lista, state.currentData.data.paginacao);
  }

  function initializeDashboard() {
    document.querySelectorAll('[data-page]').forEach(function (button) {
      button.addEventListener('click', function () {
        navigate(button.dataset.page);
      });
    });
    if (window.matchMedia) {
      const mobileQuery = window.matchMedia('(max-width: 720px)');
      if (mobileQuery.addEventListener) mobileQuery.addEventListener('change', rerenderCurrentList);
    }
    const detailDialog = document.getElementById('detailDialog');
    document.getElementById('detailClose').addEventListener('click', closeDetails);
    detailDialog.addEventListener('keydown', function (event) {
      if (event.key === 'Escape') {
        event.preventDefault();
        closeDetails();
      }
    });
    detailDialog.addEventListener('close', function () {
      clearNode(document.getElementById('detailContent'));
      const fallback = detailFallbackFocus || document.getElementById('mainContent');
      if (detailRestoreFocus && detailRestoreFocus.isConnected && detailRestoreFocus.focus) detailRestoreFocus.focus();
      else if (fallback && fallback.focus) fallback.focus();
      detailRestoreFocus = null;
      detailFallbackFocus = null;
    });
    navigate(state.page);
  }

  if (document.addEventListener) {
    document.addEventListener('DOMContentLoaded', initializeDashboard);
  }
</script>
