<style>
  :root {
    --lime: #dfff22;
    --bg: #080909;
    --panel: #111313;
    --panel-2: #171919;
    --line: #292c2c;
    --text: #f5f7f7;
    --muted: #969d9d;
    --danger: #ff6b5f;
    --warning: #ffb84d;
    --success: #76df8b;
    --radius: 14px;
    --sidebar: 246px;
    --space-1: 4px;
    --space-2: 8px;
    --space-3: 12px;
    --space-4: 16px;
    --space-6: 24px;
    --space-8: 32px;
    --focus-ring: 0 0 0 3px rgba(223, 255, 34, .28);
  }

  * { box-sizing: border-box; }

  html { color-scheme: dark; }

  body {
    margin: 0;
    min-height: 100vh;
    color: var(--text);
    background: var(--bg);
    font: 14px/1.45 Inter, Arial, sans-serif;
  }

  button,
  input,
  select { font: inherit; }

  button { cursor: pointer; }

  button:focus-visible,
  input:focus-visible,
  select:focus-visible,
  [tabindex]:focus-visible {
    outline: 2px solid var(--lime);
    outline-offset: 2px;
    box-shadow: var(--focus-ring);
  }

  .app-shell {
    min-height: 100vh;
    display: grid;
    grid-template-columns: var(--sidebar) minmax(0, 1fr);
  }

  .desktop-nav {
    position: sticky;
    top: 0;
    height: 100vh;
    padding: 28px 18px;
    border-right: 1px solid var(--line);
    background: #050606;
    display: flex;
    flex-direction: column;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: var(--space-3);
    min-height: 40px;
    margin-bottom: var(--space-8);
  }

  .brand-mark {
    width: 40px;
    height: 40px;
    display: grid;
    place-items: center;
    flex: 0 0 40px;
    border-radius: 8px;
    background: var(--lime);
    color: #050606;
    font-size: 13px;
    font-weight: 900;
    letter-spacing: -.04em;
  }

  .brand-copy {
    font-size: 16px;
    font-weight: 850;
    letter-spacing: .14em;
  }

  .nav-list { display: grid; gap: var(--space-2); }

  .nav-button {
    position: relative;
    width: 100%;
    min-height: 44px;
    padding: 0 var(--space-3);
    display: flex;
    align-items: center;
    gap: var(--space-3);
    color: var(--muted);
    background: transparent;
    border: 1px solid transparent;
    border-radius: 10px;
    text-align: left;
    transition: color 140ms ease, background-color 140ms ease, border-color 140ms ease, transform 140ms ease;
  }

  .nav-button:hover {
    color: var(--text);
    background: var(--panel-2);
    border-color: var(--line);
  }

  .nav-button:active { transform: translateY(1px); }

  .nav-button.active {
    color: #050606;
    background: var(--lime);
    border-color: var(--lime);
    font-weight: 750;
  }

  .nav-button::after {
    content: attr(aria-label);
    position: absolute;
    left: calc(100% + var(--space-3));
    top: 50%;
    z-index: 30;
    padding: var(--space-2) var(--space-3);
    color: var(--text);
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 8px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, .35);
    font-size: 12px;
    font-weight: 700;
    white-space: nowrap;
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
    transform: translate(4px, -50%);
    transition: opacity 120ms ease, transform 120ms ease, visibility 120ms ease;
  }

  .nav-icon {
    width: 28px;
    font: 700 11px/1 ui-monospace, SFMono-Regular, Consolas, monospace;
    letter-spacing: .06em;
  }

  .nav-meta {
    margin: auto 0 0;
    padding: var(--space-3);
    color: var(--muted);
    font-size: 12px;
  }

  .workspace { min-width: 0; }

  .app-header {
    position: sticky;
    top: 0;
    z-index: 10;
    min-height: 88px;
    padding: var(--space-4) 34px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: var(--space-4);
    border-bottom: 1px solid var(--line);
    background: rgba(8, 9, 9, .94);
    backdrop-filter: blur(12px);
  }

  .eyebrow {
    margin: 0 0 var(--space-1);
    color: var(--lime);
    font-size: 11px;
    font-weight: 800;
    letter-spacing: .12em;
    text-transform: uppercase;
  }

  #pageTitle {
    margin: 0;
    font-size: 24px;
    line-height: 1.15;
    letter-spacing: -.025em;
  }

  .header-status {
    margin: 0;
    padding: var(--space-2) var(--space-3);
    color: var(--muted);
    border: 1px solid var(--line);
    border-radius: 999px;
    font-size: 12px;
    white-space: nowrap;
  }

  .header-status span { color: var(--success); }

  .content {
    min-width: 0;
    padding: 30px 34px 100px;
  }

  .filters {
    min-height: 44px;
    margin-bottom: var(--space-4);
    display: flex;
    align-items: end;
    flex-wrap: wrap;
    gap: var(--space-3);
  }

  .filter-field { display: grid; gap: var(--space-1); }

  .filter-field label {
    color: var(--muted);
    font-size: 12px;
    font-weight: 700;
  }

  .filter-control {
    min-height: 44px;
    padding: 0 var(--space-3);
    color: var(--text);
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--panel);
  }

  .filter-control:hover { border-color: #464b4b; }

  .kpi-grid {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: var(--space-3);
    margin-bottom: var(--space-3);
  }

  .chart-grid {
    display: grid;
    grid-template-columns: minmax(0, 1.55fr) minmax(300px, .85fr);
    gap: var(--space-3);
    margin-bottom: var(--space-3);
  }

  .card,
  .list-panel {
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: var(--panel);
  }

  .kpi-card {
    min-height: 132px;
    padding: var(--space-4);
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    overflow: hidden;
  }

  .kpi-label {
    margin: 0;
    color: var(--muted);
    font-size: 12px;
    font-weight: 700;
  }

  .kpi-value {
    margin: var(--space-3) 0 var(--space-1);
    font-size: 32px;
    font-weight: 800;
    line-height: 1;
    letter-spacing: -.04em;
  }

  .kpi-note { margin: 0; color: var(--muted); font-size: 12px; }

  .status {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-weight: 750;
  }

  .status::before {
    content: '';
    width: 7px;
    height: 7px;
    border: 2px solid currentColor;
    border-radius: 50%;
  }

  .status-success { color: var(--success); }
  .status-warning { color: var(--warning); }
  .status-danger { color: var(--danger); }

  .chart-card { min-height: 330px; padding: var(--space-4); }

  .card-header {
    margin-bottom: var(--space-4);
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: var(--space-3);
  }

  .card-title { margin: 0; font-size: 16px; line-height: 1.25; }

  .card-subtitle { margin: var(--space-1) 0 0; color: var(--muted); font-size: 12px; }

  .chart-frame { position: relative; min-height: 250px; }

  .list-panel { overflow: hidden; }

  .list-header {
    padding: var(--space-4);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: var(--space-3);
    border-bottom: 1px solid var(--line);
  }

  .table-scroll {
    max-height: min(560px, 65vh);
    overflow-x: auto;
    overflow-y: auto;
    overscroll-behavior: contain;
    scrollbar-gutter: stable;
  }

  .data-table {
    width: 100%;
    border-collapse: collapse;
    font-variant-numeric: tabular-nums;
  }

  .data-table th,
  .data-table td {
    min-height: 48px;
    padding: var(--space-3) var(--space-4);
    border-bottom: 1px solid var(--line);
    text-align: left;
    vertical-align: middle;
  }

  .data-table th {
    position: sticky;
    top: 0;
    z-index: 1;
    color: var(--muted);
    background: var(--panel-2);
    font-size: 11px;
    font-weight: 800;
    letter-spacing: .06em;
    text-transform: uppercase;
    white-space: nowrap;
  }

  .data-table tbody tr:hover { background: var(--panel-2); }
  .data-table tbody tr:last-child td { border-bottom: 0; }
  .data-table .numeric { text-align: right; }

  .mobile-cards { display: none; gap: var(--space-2); padding: var(--space-3); }

  .mobile-data-row {
    padding: var(--space-3) 0;
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    gap: var(--space-2) var(--space-4);
    border-bottom: 1px solid var(--line);
  }

  .mobile-data-row:last-child { border-bottom: 0; }

  .app-state {
    min-height: 220px;
    padding: var(--space-8);
    display: grid;
    place-content: center;
    justify-items: center;
    gap: var(--space-3);
    color: var(--muted);
    text-align: center;
  }

  .app-state p { margin: 0; }

  .app-state.error {
    color: var(--danger);
    border: 1px solid currentColor;
    border-radius: var(--radius);
    background: rgba(255, 107, 95, .06);
  }

  .app-state[hidden] { display: none; }

  .spinner {
    width: 28px;
    height: 28px;
    border: 3px solid var(--line);
    border-top-color: var(--lime);
    border-radius: 50%;
    animation: spin .8s linear infinite;
  }

  .skeleton {
    border-radius: 6px;
    background: linear-gradient(90deg, var(--panel-2) 25%, #232626 50%, var(--panel-2) 75%);
    background-size: 200% 100%;
    animation: shimmer 1.4s ease-in-out infinite;
  }

  .mobile-nav { display: none; }

  .mobile-nav-button {
    min-width: 0;
    min-height: 58px;
    padding: 7px var(--space-1);
    display: grid;
    place-content: center;
    gap: 3px;
    color: var(--muted);
    background: transparent;
    border: 0;
    border-radius: 10px;
    font-size: 10px;
    font-weight: 700;
    text-align: center;
  }

  .mobile-nav-button:hover { color: var(--text); background: var(--panel-2); }
  .mobile-nav-button:active { transform: translateY(1px); }

  .mobile-nav-button.active {
    color: #050606;
    background: var(--lime);
  }

  .mobile-nav-icon {
    font: 800 10px/1 ui-monospace, SFMono-Regular, Consolas, monospace;
    letter-spacing: .05em;
  }

  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes shimmer { to { background-position: -200% 0; } }

  @media (max-width: 1050px) {
    :root { --sidebar: 78px; }
    .desktop-nav { padding-inline: var(--space-3); }
    .brand { justify-content: center; }
    .nav-label, .brand-copy { display: none; }
    .nav-button { justify-content: center; padding-inline: var(--space-2); }
    .nav-icon { width: auto; }
    .nav-meta { padding-inline: 0; text-align: center; font-size: 0; }
    .kpi-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .chart-grid { grid-template-columns: minmax(0, 1.3fr) minmax(260px, .8fr); }
  }

  @media (min-width: 721px) and (max-width: 1050px) {
    .nav-button:hover::after,
    .nav-button:focus-visible::after {
      opacity: 1;
      visibility: visible;
      transform: translate(0, -50%);
    }
  }

  @media (max-width: 720px) {
    .app-shell { display: block; }
    .desktop-nav { display: none; }
    .app-header { min-height: 78px; padding: var(--space-3) var(--space-4); }
    #pageTitle { font-size: 20px; }
    .header-status { max-width: 132px; overflow: hidden; text-overflow: ellipsis; }
    .content {
      padding: 22px 16px;
      padding-bottom: calc(92px + env(safe-area-inset-bottom));
    }
    .filters { align-items: stretch; }
    .filter-field { flex: 1 1 145px; }
    .filter-control { width: 100%; }
    .kpi-grid { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: thin; }
    .kpi-card { min-width: 235px; scroll-snap-align: start; }
    .chart-grid { display: block; }
    .chart-card { min-height: 290px; margin-bottom: var(--space-3); }
    .chart-frame { min-height: 210px; }
    .data-table { display: none; }
    .mobile-cards { display: grid; }
    .mobile-nav {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      position: fixed;
      left: 10px;
      right: 10px;
      bottom: max(10px, env(safe-area-inset-bottom));
      z-index: 20;
      padding: var(--space-1);
      background: rgba(17,19,19,.96);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: 0 12px 32px rgba(0, 0, 0, .4);
      backdrop-filter: blur(12px);
    }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      scroll-behavior: auto !important;
      animation-duration: .01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: .01ms !important;
    }
  }
</style>
