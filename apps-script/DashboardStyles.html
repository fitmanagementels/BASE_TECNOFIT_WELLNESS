<style>
:root {
  --lime: #dfff22;
  --lime-soft: rgba(223, 255, 34, .13);
  --bg: #080a0a;
  --surface: rgba(18, 23, 23, .88);
  --surface-strong: #151a1a;
  --surface-input: rgba(8, 12, 12, .82);
  --line: rgba(218, 232, 224, .14);

  --text: #f4f7f5;
  --muted: #9eaaa5;
  --muted-strong: #c7d0cb;
  --orange: #ffb84d;
  --red: #ff6559;
  --purple: #c28aff;
  --green: #79e397;

  --radius-card: 16px;

  --shadow-card: 0 18px 45px rgba(0, 0, 0, .22);
  --shadow-float: 0 24px 60px rgba(0, 0, 0, .42);
  --ease: 170ms cubic-bezier(.2, .75, .2, 1);
}

* { box-sizing: border-box; }
html { min-height: 100%; background: var(--bg); }
body {
  min-height: 100vh;
  margin: 0;
  color: var(--text);
  background:

    radial-gradient(circle at 26% 120%, rgba(39, 92, 72, .12), transparent 36rem),
    var(--bg);
  font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  font-size: 14px;
  line-height: 1.48;
}

button, select, input, textarea { font: inherit; }
button { cursor: pointer; }
button, select, input, textarea { -webkit-tap-highlight-color: transparent; }

}

.app-shell { min-height: 100vh; display: grid; grid-template-columns: 252px minmax(0, 1fr); }
.dashboard-workspace { min-width: 0; }

.brand-logo { display: block; object-fit: contain; flex: 0 0 auto; }

.brand-logo-splash { width: 66px; height: 66px; border-radius: 18px; box-shadow: 0 16px 46px rgba(223, 255, 34, .22); }

  height: 100vh;
  padding: 28px 16px 20px;

.nav-button, .dock-button, .subnav button {

  width: 100%;
  min-height: 43px;
  border: 1px solid var(--line);
  border-radius: 10px;
  color: var(--text);

.kpi::after { content: ""; position: absolute; inset: auto -18% -65% 40%; z-index: -1; height: 118px; border-radius: 999px; background: radial-gradient(ellipse, rgba(223, 255, 34, .13), transparent 68%); opacity: 0; transition: opacity var(--ease); }
.kpi:hover { transform: translateY(-3px); border-color: rgba(223, 255, 34, .4); box-shadow: 0 22px 48px rgba(0, 0, 0, .34); }
.kpi:hover::after, .kpi:focus-visible::after { opacity: 1; }

.kpi strong { display: block; margin-top: 20px; font-size: clamp(28px, 2.6vw, 36px); line-height: 1; letter-spacing: -.06em; }
.kpi em { display: block; margin-top: 9px; color: var(--lime); font-size: 12px; font-style: normal; font-weight: 700; }

.section-card {
  padding: 22px;
  border: 1px solid var(--line);
  border-radius: var(--radius-card);
  background: var(--surface);
  box-shadow: var(--shadow-card);
}
.section-card h3 { margin: 0 0 17px; color: var(--text); font-size: 16px; letter-spacing: -.015em; }
.bar-list { display: grid; gap: 8px; }
.bar-row { display: grid; grid-template-columns: minmax(100px, 1fr) minmax(100px, 2.2fr) 48px; align-items: center; gap: 14px; width: 100%; min-height: 42px; padding: 6px 8px; border: 1px solid transparent; border-radius: 10px; color: var(--muted-strong); background: transparent; text-align: left; }
button.bar-row { transition: background var(--ease), border-color var(--ease), color var(--ease); }
button.bar-row:hover { border-color: var(--line); color: var(--text); background: rgba(255, 255, 255, .035); }
.bar { display: block; height: 8px; overflow: hidden; border-radius: 999px; background: rgba(255, 255, 255, .08); }

.bar-row strong { color: var(--text); font-size: 13px; text-align: right; }

.chip { display: inline-flex; align-items: center; padding: 4px 8px; border: 1px solid currentColor; border-radius: 999px; font-size: 11px; font-weight: 750; line-height: 1.15; }
.estado-verde { color: var(--green); }.estado-laranja { color: var(--orange); }.estado-vermelho { color: var(--red); }.estado-roxo { color: var(--purple); }.estado-falha_critica { color: var(--critical); }.estado-sem_ficha, .estado-sem_avaliacao { color: var(--lime); }

.detail-dialog { width: min(900px, calc(100vw - 36px)); max-height: 86vh; padding: 0; overflow: hidden; border: 1px solid var(--line-strong); border-radius: 20px; color: var(--text); background: #111515; box-shadow: var(--shadow-float); }
.detail-dialog::backdrop { background: rgba(0, 0, 0, .74); backdrop-filter: blur(5px); }

.icon-button { display: grid; width: 38px; height: 38px; place-items: center; border: 1px solid var(--line); border-radius: 10px; color: var(--text); background: rgba(255, 255, 255, .03); font-size: 25px; line-height: 1; transition: background var(--ease), border-color var(--ease); }
.icon-button:hover { border-color: var(--line-strong); background: rgba(255, 255, 255, .08); }

.loading-screen { position: fixed; inset: 0; z-index: 50; display: grid; align-content: center; justify-items: center; gap: 13px; padding: 28px; text-align: center; background: radial-gradient(circle at 50% 38%, rgba(223, 255, 34, .15), transparent 18rem), #080a0a; }.loading-screen[hidden] { display: none; }.loading-screen h1 { margin: 0; font-size: clamp(27px, 6vw, 36px); letter-spacing: -.045em; }.loading-kicker { margin: 5px 0 0; color: var(--lime); font-size: 11px; font-weight: 850; letter-spacing: .2em; }.progress-track { width: min(330px, 78vw); height: 7px; overflow: hidden; border-radius: 999px; background: rgba(255, 255, 255, .1); }.progress-track span { display: block; width: 0; height: 100%; border-radius: inherit; background: linear-gradient(90deg, #b9d919, var(--lime)); box-shadow: 0 0 18px rgba(223, 255, 34, .4); transition: width .3s ease; }

.save-status { position: fixed; right: 20px; bottom: 20px; z-index: 12; margin: 0; padding: 9px 12px; border: 1px solid var(--line); border-radius: 10px; color: var(--text); background: rgba(25, 31, 31, .93); box-shadow: var(--shadow-card); font-size: 12px; }
.settings-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }.settings-grid label { display: grid; gap: 6px; color: var(--muted-strong); }.settings-grid textarea { min-height: 90px; padding: 10px 12px; resize: vertical; }.settings-grid .section-card { display: grid; align-content: start; gap: 12px; }.primary { min-height: 42px; justify-self: start; padding: 0 15px; border: 1px solid transparent; border-radius: 10px; color: #090b08; background: var(--lime); box-shadow: 0 8px 20px rgba(223, 255, 34, .15); font-weight: 800; transition: transform var(--ease), box-shadow var(--ease), background var(--ease); }.primary:hover { transform: translateY(-1px); background: #edff69; box-shadow: 0 12px 28px rgba(223, 255, 34, .25); }

.mobile-dock { display: none; }

@media (max-width: 1000px) { .app-shell { grid-template-columns: 218px minmax(0, 1fr); }.kpi-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }.content { padding-left: 28px; padding-right: 28px; } }
@media (max-width: 720px) {
  .app-shell { display: block; }.desktop-sidebar { display: none; }.topbar { min-height: 78px; padding: 13px 17px; gap: 11px; }.topbar > div { min-width: 0; }.brand-logo-mobile { display: block; width: 35px; height: 35px; border-radius: 10px; }.eyebrow { font-size: 9px; }.topbar h1 { margin-top: 2px; font-size: 23px; }.update-label { max-width: 126px; overflow: hidden; padding: 6px 8px; font-size: 10px; text-overflow: ellipsis; }.content { padding: 18px 16px 108px; }.global-filters { width: 100%; gap: 8px; margin-bottom: 18px; padding: 8px; border-radius: 14px; }.global-filters label { min-width: 0; flex: 1; }.global-filters select { min-width: 0; min-height: 42px; padding: 0 9px; font-size: 12px; }.subnav { margin-bottom: 18px; }.subnav button { min-height: 42px; padding: 0 8px; font-size: 12px; }.page-content { gap: 13px; }.kpi-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }.kpi { min-height: 128px; padding: 15px; border-radius: 14px; }.kpi strong { margin-top: 17px; font-size: 27px; }.kpi .label, .kpi em { font-size: 11px; }.section-card { padding: 17px; border-radius: 14px; }.section-card h3 { margin-bottom: 13px; }.bar-row { grid-template-columns: minmax(74px, 1fr) minmax(65px, 1.45fr) 32px; gap: 8px; padding: 5px 3px; font-size: 12px; }.detail-dialog { width: 100vw; height: 100vh; max-height: 100vh; border: 0; border-radius: 0; }.detail-dialog #detailContent { max-height: calc(100vh - 72px); padding: 6px 17px 18px; }.mobile-dock { position: fixed; right: 10px; bottom: 0; left: 10px; z-index: 15; display: grid; grid-template-columns: repeat(4, 1fr); gap: 3px; padding: 7px 5px calc(7px + env(safe-area-inset-bottom)); border: 1px solid var(--line-strong); border-bottom: 0; border-radius: 18px 18px 0 0; background: rgba(16, 21, 21, .94); box-shadow: 0 -14px 40px rgba(0, 0, 0, .28); backdrop-filter: blur(18px); }.dock-button { min-height: 52px; padding: 5px 2px; border-radius: 11px; text-align: center; font-size: 10px; }.dock-button:hover { color: var(--text); background: rgba(255, 255, 255, .055); }.dock-button.active { color: #090b08; background: var(--lime); box-shadow: 0 7px 18px rgba(223, 255, 34, .17); }.hero-line { display: block; }.hero-line .body-copy { margin-top: 7px; }.settings-grid { grid-template-columns: 1fr; gap: 13px; }.save-status { right: 16px; bottom: 86px; max-width: calc(100vw - 32px); } }
@media (max-width: 380px) { .topbar { padding-right: 13px; padding-left: 13px; }.content { padding-right: 12px; padding-left: 12px; }.update-label { display: none; }.kpi { padding: 13px; }.kpi strong { font-size: 25px; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; } }
</style>
